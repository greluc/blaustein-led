name: Feature request
description: Suggest a new effect, parameter, board or improvement.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Search the [open issues](https://github.com/greluc/blaustein-led/issues) first; if it is already there, add your use case as a comment.

  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: The look or behaviour you are after and why the current firmware does not give it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work, for example a new `FireConfig` parameter or a new pin.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you tried, such as tuning the existing parameters.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
