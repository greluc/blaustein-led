[graph]
targets = ["thumbv8m.main-none-eabihf", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained transitive crates (bare-metal, paste, proc-macro-error2) have no replacement this
# project can choose; only direct dependencies fail the check.
unmaintained = "workspace"

[licenses]
# rp-pac and rp2040-boot2 are BSD-3-Clause only; unicode-ident adds Unicode-3.0.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
# Embassy and defmt pull in several major versions of the same crates.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
