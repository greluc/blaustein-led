[workspace]
members = ["fire-effect"]

[workspace.package]
version = "1.0.0"
authors = ["Lucas Greuloch (greluc) <lucas.greuloch@gmail.com>"]
homepage = "https://github.com/greluc/blaustein-led"
repository = "https://github.com/greluc/blaustein-led"
license = "MIT"
edition = "2024"
# Current stable toolchain.
rust-version = "1.99.1"
publish = false

[package]
name = "blaustein-led"
description = "Controls the LEDs of Burg Blaustein."
keywords = ["led", "embedded"]
categories = ["embedded"]
readme = "README.md"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Default build contains no defmt stack to minimize size and overhead. It uses a
# panic handler that resets the chip, so the unattended installation recovers by
# itself.
default = []
# Enable this feature to include defmt logging and RTT transport, and to turn on
# defmt features in Embassy crates. Also switches to the `panic-probe` handler,
# which halts on panic so an attached debugger can inspect the fault.
# Build with the `release-debug` profile so the symbol table defmt needs survives.
debug = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-rp/defmt",
    "embassy-time/defmt",
    "panic-probe/print-defmt",
]

[dependencies]
fire-effect = { path = "fire-effect" }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.5.1" }
embassy-rp = { version = "0.10.0", features = [
    "time-driver",
    "critical-section-impl",
    "rp235xa",
    "binary-info",
] }
cortex-m-rt = "0.7.7"
# Used for the resetting panic handler; already in the tree via embassy-rp.
cortex-m = "0.7.10"
# Only pulled in by the `debug` feature; release builds supply their own
# resetting panic handler.
panic-probe = { version = "1.0.0", optional = true }
defmt = { version = "1.2.0", optional = true }
defmt-rtt = { version = "1.3.1", optional = true }

[[bin]]
name = "blaustein-led"
test = false
bench = false

[lints]
workspace = true

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
warnings = "deny"
deprecated_safe = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unsafe_code = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Embassy and defmt pull in several major versions of the same crates.
multiple_crate_versions = "allow"
# The executor is single-threaded; its task futures are never sent across threads.
future_not_send = "allow"
# Restriction lints that fit a no_std, integer-only firmware.
absolute_paths = "deny"
alloc_instead_of_core = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
float_arithmetic = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
min_ident_chars = "deny"
missing_assert_message = "deny"
missing_docs_in_private_items = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
needless_raw_strings = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
semicolon_inside_block = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
tests_outside_test_module = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"

# opt-level 0 produces needlessly large and slow firmware; 1 keeps debug builds
# usable on the target while staying easy to step through.
[profile.dev]
opt-level = 1
debug = 2

# `opt-level = "s"` rather than 3: this workload is idle almost all the time, and
# level 3 unrolls loops aggressively enough to nearly double .text for no gain.
[profile.release]
opt-level = "s"
lto = "fat"
incremental = false
codegen-units = 1
strip = "symbols"

# Release-grade code generation, but keeps the symbol table that defmt needs to
# decode RTT output (`strip = "symbols"` would discard it).
# Use with: cargo build --profile release-debug --features debug
[profile.release-debug]
inherits = "release"
strip = "none"
debug = 2
